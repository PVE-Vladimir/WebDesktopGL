<!doctype html>
<html>
<head>
	<title>Attributes test</title>
</head>
<body onauxclick="return false" oncontextmenu="return false" >
<script>
// Функция для проверки клавиш (без изменений)
window.addEventListener('keydown', function(e) {
const key = e.key.toLowerCase();
// Разрешенные комбинации
const allowedCombinations = ['c', 'v', 'a', 'с', 'м', 'ф', 'f5', 'z', 'я', 'f', 'а']; // кириллические символы
if (key === 'f12' || key === 'f3') {
e.preventDefault();
return false;
}
if (e.ctrlKey) {
if (allowedCombinations.includes(key)) {
return true;
}
e.preventDefault();
return false;
}
}, true);
document.addEventListener('contextmenu', event => event.preventDefault());
window.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('click', function(e) {
if (e.ctrlKey && e.button === 0) {
e.preventDefault();
return false;
}
if (e.shiftKey && e.button === 0) {
e.preventDefault();
return false;
}
}, true);
</script>
	<!-- Normal attributes -->
	<button id="test0" class="value0" title="value1">class="value0" title="value1"</button>

	<!-- Attributes with no quotes or value -->
	<button id="test1" class=value2 disabled>class=value2 disabled</button>

	<!-- Attributes with no space between them. No valid, but accepted by the browser -->
	<button id="test2" class="value4"title="value5">class="value4"title="value5"</button>
</body>
</html>
